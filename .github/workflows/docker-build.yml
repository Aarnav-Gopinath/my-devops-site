name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-site .

      - name: Run container
        run: docker run -d --name my-site -p 8080:80 my-site

      - name: Health check
        run: |
          sleep 3
          curl --fail http://localhost:8080
